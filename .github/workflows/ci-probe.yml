name: CI probe (3D room on a hosted runner)

# Investigates why the 3D room hangs under software GL on ubuntu-latest (navigation.spec and the signed-in suite time out).
# Runs the room under several Chromium GL setups and prints frames per second, page round-trip latency and viewport-resize time.
# Run it from the Actions tab (workflow_dispatch) or on a pull request that touches the probe.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/ci-room-probe.mjs'
      - '.github/workflows/ci-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_WORKSPACE_ID: ${{ secrets.VITE_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Runner
        run: |
          nproc
          free -m
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|MHz" || true
      - run: npm run build
      - name: Probe
        run: |
          npx vite preview --port 4173 > /tmp/preview.log 2>&1 &
          sleep 4
          node scripts/ci-room-probe.mjs 2>&1 | tee /tmp/probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-probe
          path: /tmp/probe.log
