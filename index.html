<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Marginalia — Margins are where thinking happens</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#302E2A">

  <!-- PWA / Add to Home Screen -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marginalia">
  <link rel="apple-touch-icon" href="/icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    Type system (target): Fraunces (serif body+display) · IBM Plex Mono (labels) · Bodoni Moda (covers only)
    Cormorant / Libre Caslon / Inter are still loaded only because preloader book data references them
    on individual covers. Migrate book schema to use the 3-font system, then drop these three.
  -->

  <link rel="stylesheet" href="src/core/base.css">
  <link rel="stylesheet" href="src/preloader/preloader.css">
  <link rel="stylesheet" href="src/search/search.css">
  <link rel="stylesheet" href="src/library-2d/library-2d.css">
  <link rel="stylesheet" href="src/three-room/three-room.css">
  <link rel="stylesheet" href="src/components/notes-wall/notes-wall.css">
  <link rel="stylesheet" href="src/book/book.css">
  <link rel="stylesheet" href="src/map/map.css">
  <link rel="stylesheet" href="src/core/auth.css">
  <link rel="stylesheet" href="src/core/concept-ui.css">
  <link rel="stylesheet" href="src/web/web.css">
  <link rel="stylesheet" href="src/new-entry/new-entry.css">
  <link rel="stylesheet" href="src/ai/ai.css">

  <!-- amCharts (used by map view) — loaded eagerly so first visit boots fast -->
  <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/map.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/geodata/chinaHigh.js"></script>

</head>
<body data-view="preloader">
  <svg aria-hidden="true" width="0" height="0" style="position:absolute; width:0; height:0; overflow:hidden;">
    <symbol id="icon-nav-search" viewBox="0 0 16 16">
      <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.35"/>
      <path d="M10.5 10.5 14 14" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-nav-shelf" viewBox="0 0 16 16">
      <rect x="1.5" y="2" width="3" height="12" rx="0.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <rect x="6.5" y="2" width="3" height="12" rx="0.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <rect x="11.5" y="2" width="3" height="12" rx="0.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
    </symbol>
    <symbol id="icon-nav-map" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M2.2 8h11.6M8 2.1c2 1.8 2 10 0 11.8M8 2.1c-2 1.8-2 10 0 11.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-nav-library" viewBox="0 0 16 16">
      <rect x="1.8" y="2.2" width="4.1" height="11.6" rx="0.7" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <rect x="6.8" y="5" width="3.8" height="8.8" rx="0.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <rect x="11.5" y="3.2" width="2.7" height="10.6" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
    </symbol>
    <symbol id="icon-nav-graph" viewBox="0 0 16 16">
      <circle cx="3" cy="3" r="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="13" cy="4" r="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="9" cy="13" r="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M4.2 3.6 11.7 4.2M12.1 5.2 9.7 11.7M4 4.2 8.1 11.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-nav-list" viewBox="0 0 16 16">
      <path d="M2.1 3.6 3 4.6 4.5 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M2.1 8 3 9 4.5 7.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M2.1 12.3 3 13.3 4.5 11.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6.2 3.8h7.2M6.2 8.2h7.2M6.2 12.5h7.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>
    <!-- Stat-card icons (hollow stroke style) -->
    <symbol id="icon-stat-finished" viewBox="0 0 16 16">
      <path d="M8 3.4C6.7 2.5 4.6 2.2 2.4 2.6v9.6c2.2-.4 4.3-.1 5.6.8 1.3-.9 3.4-1.2 5.6-.8V2.6c-2.2-.4-4.3-.1-5.6.8Z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
      <path d="M8 3.4v9.8" fill="none" stroke="currentColor" stroke-width="1.25"/>
    </symbol>
    <symbol id="icon-stat-reading" viewBox="0 0 16 16">
      <path d="M2.6 3.2h3.1c.9 0 1.7.4 2.3 1 .6-.6 1.4-1 2.3-1h3.1v8.6h-3.4c-.8 0-1.5.3-2 .9-.5-.6-1.2-.9-2-.9H2.6Z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-stat-highlights" viewBox="0 0 16 16">
      <path d="M10.6 2.6 13.4 5.4 6 12.8 3.2 13.8 4.2 11Z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
      <path d="M9.4 3.8 12.2 6.6" fill="none" stroke="currentColor" stroke-width="1.25"/>
    </symbol>
    <symbol id="icon-stat-actions" viewBox="0 0 16 16">
      <rect x="2.6" y="2.6" width="10.8" height="10.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.25"/>
      <path d="M5.2 8.2 7.2 10.2 11 5.6" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <!-- ============================================================
       VIEW: PRELOADER
       ============================================================ -->
  <div id="view-preloader" class="theme-ink">

    <header class="masthead">
      <a class="chapter" href="#" id="preloaderWordmark" style="visibility:hidden" aria-hidden="true"></a>
    </header>

    <div class="headline-wrap">
      <h1 class="headline">Marginalia</h1>
      <div class="headline-sub">Margins are where thinking happens.</div>
    </div>

    <main class="stage">
      <div class="viewport">
        <div class="track" id="track"></div>
      </div>
    </main>

    <div class="loader-meta" id="loaderMeta">
      <span class="dot"></span>
      <span id="loaderLabel">Reviewing the collection</span>
    </div>

    <button class="skip"          id="skipBtn">Skip</button>
    <button class="tweaks-toggle" id="tweaksToggle">Tweaks</button>

    <div class="tweaks" id="tweaksPanel">
      <h3>Tweaks <small>Marginalia</small></h3>
      <div class="tweak-row">
        <label>Animation speed <span class="num" id="speedNum">0.8×</span></label>
        <input type="range" id="speedSlider" min="0.4" max="2.0" step="0.1" value="1.0">
      </div>
      <div class="tweak-row">
        <label>Swing intensity <span class="num" id="swingNum">100%</span></label>
        <input type="range" id="swingSlider" min="30" max="180" step="5" value="100">
      </div>
      <div class="tweak-row">
        <label>Background</label>
        <div class="row-flex" id="themeRow">
          <div class="swatch"        data-theme="taupe" style="background:#b8ad9e"></div>
          <div class="swatch"        data-theme="cream" style="background:#e8dfc8"></div>
          <div class="swatch"        data-theme="sage"  style="background:#aab39a"></div>
          <div class="swatch"        data-theme="clay"  style="background:#c89f85"></div>
          <div class="swatch active" data-theme="ink"   style="background:#302e2a"></div>
        </div>
      </div>
      <div class="tweak-row">
        <label>Book palette</label>
        <div class="row-flex" id="paletteRow">
          <button class="chip active" data-palette="editorial">Editorial</button>
          <button class="chip"        data-palette="jewel">Jewel</button>
          <button class="chip"        data-palette="mono">Mono</button>
        </div>
      </div>
    </div>

  </div><!-- /view-preloader -->


  <!-- ============================================================
       VIEW: SEARCH
       ============================================================ -->
  <div id="view-search" class="room-panel" hidden>
  <div class="tool-page-shell tool-page-shell--search">
  <div class="tool-page-inner tool-page-inner--search">
  <div class="page">

    <div class="shared-header-wrap" id="searchHeaderWrap"></div>

    <section id="shelf" class="shelf-section">
      <div class="section-head">
        <label class="section-subtitle shelf-search-label" for="shelfSearchInput">Search</label>
        <span class="count" id="shelfCount">0 books</span>
      </div>
      <div class="shelf-layout">
        <div class="shelf-stack-panel">
          <div class="shelf-toolbar-block">
          <div class="shelf-tools">
            <div class="shelf-searchbar">
              <svg class="shelf-searchbar-icon" aria-hidden="true"><use href="#icon-nav-search"></use></svg>
              <input id="shelfSearchInput" type="search" placeholder="Search your shelf by title, author, or tag">
            </div>
            <div class="shelf-filters-wrap">
              <button class="shelf-filters-toggle" id="shelfFiltersToggle" type="button" aria-expanded="false" aria-controls="shelfFiltersMenu">
                <svg class="shelf-filters-toggle-icon" aria-hidden="true" viewBox="0 0 16 16">
                  <path d="M2.4 4.2h11.2M4.4 8h7.2M6.4 11.8h3.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                </svg>
                <span>Filters</span>
              </button>
              <div class="shelf-filters-menu" id="shelfFiltersMenu" hidden>
                <div class="shelf-filters-group">
                  <span class="shelf-filters-group-label">Status</span>
                  <div class="shelf-filters" id="shelfStatusChips">
                    <button class="chip active" data-filter="all">All</button>
                    <button class="chip" data-filter="finished">Finished</button>
                    <button class="chip" data-filter="reading">Reading</button>
                    <button class="chip" data-filter="to read">To Read</button>
                  </div>
                </div>
                <div class="shelf-filters-group">
                  <span class="shelf-filters-group-label">Sort</span>
                  <div class="shelf-filters" id="shelfSortChips">
                    <button class="chip active" data-sort="recent">Recently added</button>
                    <button class="chip" data-sort="title">Title</button>
                    <button class="chip" data-sort="rating">Rating</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="shelf-tag-row" id="shelfTagGroup" hidden>
            <div class="shelf-filters" id="shelfTagChips"></div>
          </div>

          <div class="shelf-quick-rows" id="shelfQuickRows" hidden>
            <section class="shelf-quick-row" id="shelfContinueRow" hidden>
              <div class="shelf-quick-head">
                <h3 class="shelf-quick-title">Continue Reading</h3>
              </div>
              <div class="shelf-quick-track" id="shelfContinueTrack"></div>
            </section>
            <section class="shelf-quick-row" id="shelfRecentRow" hidden>
              <div class="shelf-quick-head">
                <h3 class="shelf-quick-title">Recently Added</h3>
              </div>
              <div class="shelf-quick-track" id="shelfRecentTrack"></div>
            </section>
          </div>

          <div class="shelf-wall-head">
            <span class="shelf-wall-label">All Books</span>
          </div>
          </div><!-- /shelf-toolbar-block -->

          <div class="shelf-wall-grid">
            <div class="shelf-stack" id="shelfStack"></div>
            <aside class="shelf-preview-panel" id="shelfPreviewPanel">
              <button class="shelf-preview-close" id="shelfPreviewCloseBtn" type="button" aria-label="Close preview">×</button>
              <div class="shelf-preview-cover" id="shelfPreviewCoverFrame">
                <img id="shelfPreviewCover" alt="Selected book cover" hidden>
                <div class="shelf-preview-fallback" id="shelfPreviewFallback"></div>
              </div>
              <div class="shelf-preview-meta">
                <h3 id="shelfPreviewTitle"></h3>
                <p class="preview-subtitle" id="shelfPreviewSubtitle"></p>
                <p class="preview-author" id="shelfPreviewAuthor"></p>
                <div class="preview-stats" id="shelfPreviewStats"></div>
                <p class="preview-description" id="shelfPreviewDescription"></p>
                <div class="preview-tags" id="shelfPreviewTags"></div>
              </div>
            </aside>
          </div>

        </div>
      </div>
    </section>

  </div>
  </div>
  </div>
  </div><!-- /view-search -->

  <!-- ============================================================
       ROOM SHELL — persistent, never hidden
       ============================================================ -->
  <div id="view-room"></div>

  <!-- ============================================================
       OVERLAY PANELS — shown above the room shell
       ============================================================ -->
  <div id="panel-library"  class="room-panel" hidden></div>
  <div id="panel-book"     class="room-panel" hidden></div>
  <div id="panel-map"      class="room-panel" hidden></div>
  <div id="panel-web"      class="room-panel" hidden></div>
  <div id="panel-todo"     class="room-panel" hidden></div>
  <div id="panel-profile"  class="room-panel" hidden></div>

  <!-- TODO(p0-cleanup): view-search kept for preloader transition; merge into panel-library later. -->
  <!-- view-search is declared above in the search section -->


  <!-- Firebase SDK is loaded as an ES module bundle via src/firebase/config.ts (modular SDK, npm). -->

  <!-- hero-glb must stay before main.js so window.__heroGLBReadyPromise exists for preloader boot.
       Do not reorder these two script tags unless preloader loading contract is redesigned. -->
  <script type="module" src="src/preloader/hero-glb.js"></script>

  <!-- Vite entry: all other src/ scripts loaded in dependency order via src/main.js -->
  <script type="module" src="./src/main.js"></script>

  <!-- Annual No.1 reveal overlay — must exist before ProfileAnnualShelf mounts -->
  <div class="annual-reveal-overlay" id="annualRevealOverlay" aria-hidden="true">
    <div class="annual-reveal-inner">
      <div class="annual-reveal-kicker">No. 1 · <span id="annualRevealYear"></span></div>
      <h2 class="annual-reveal-title" id="annualRevealTitle"></h2>
      <p class="annual-reveal-author" id="annualRevealAuthor"></p>
    </div>
  </div>

</body>
</html>
